<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI im Service — Impuls · Meri</title>
<style>
  :root{
    /* Meri CI — blue primary, green accent (matches logo) */
    --navy:#123F70; --deep:#0B2C52; --panel:#1B4E86;
    --paper:#F4F7FB; --card:#FFFFFF; --ink:#1A2433; --muted:#5A6B80;
    --accent:#15549A; --green:#6CB23E; --mint:#C7E6A8; --ice:#AFCDEC;
    --ok:#2BA84A; --warn:#D97706;
    --line:#DBE5F1; --tint:#EAF1FA;
    --mono:"Consolas","Courier New",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    --serif:Cambria,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--sans);color:var(--ink);background:var(--deep)}

  /* ===== Story bar ===== */
  .storybar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(11,30,55,.95);z-index:60}
  .brandmark{position:fixed;left:16px;top:9px;z-index:62;display:flex;align-items:center;gap:8px;pointer-events:none}
  .brandmark .wm{font-family:var(--sans);font-weight:800;font-size:22px;letter-spacing:.5px;color:#fff}
  .brandmark .wm span{color:var(--green)}
  .snode{display:flex;align-items:center;gap:4px}
  .snode .lbl{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#5E7398;padding:5px 11px;border-radius:99px;cursor:pointer;transition:.2s;white-space:nowrap}
  .snode .lbl:hover{color:#fff}
  .snode.done .lbl{color:#8FB0D8}
  .snode.cur .lbl{background:var(--accent);color:#fff}
  .snode .ln{width:16px;height:1.5px;background:#2A4A74}
  .snode:last-child .ln{display:none}

  /* ===== Language switch ===== */
  .langsw{position:fixed;right:14px;top:7px;height:30px;z-index:1001;display:flex;align-items:center;gap:4px;background:rgba(11,30,55,.6);padding:0 4px;border-radius:99px;border:1px solid rgba(175,205,236,.25)}
  .langsw button{border:none;background:transparent;color:#A8C3E0;font-family:var(--sans);font-size:13px;font-weight:700;height:22px;line-height:22px;padding:0 11px;border-radius:99px;cursor:pointer;transition:.15s}
  .langsw button:hover{color:#fff}
  .langsw button.on{background:var(--accent);color:#fff}

  /* ===== Stage ===== */
  .stage{position:absolute;top:44px;bottom:0;left:0;right:0}
  section{position:absolute;inset:0;padding:5vh 7vw 6vh;opacity:0;pointer-events:none;transition:opacity .35s;display:flex;flex-direction:column}
  section.active{opacity:1;pointer-events:auto}
  section.dark{background:var(--navy);color:#fff}
  section.light{background:var(--paper)}

  .eyebrow{font-size:clamp(13px,1.25vw,18px);letter-spacing:3px;text-transform:uppercase;font-weight:800;color:var(--accent)}
  .dark .eyebrow{color:var(--mint)}
  h1{font-family:var(--serif);font-weight:800;line-height:1.1;font-size:clamp(42px,5.4vw,76px);margin-top:1.5vh}
  h2{font-family:var(--serif);font-weight:800;line-height:1.12;font-size:clamp(34px,4.4vw,62px);color:var(--navy);margin-top:1vh}
  .dark h2{color:#fff}
  .dark h2 em{color:var(--ice);font-style:normal}

  /* Fragments */
  .frag{opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .4s ease}
  .frag.on{opacity:1;transform:none}

  /* ===== S1 ===== */
  #s1{justify-content:center}
  #s1 .q{font-family:var(--serif);font-size:clamp(40px,5.2vw,78px);font-weight:800;line-height:1.15;max-width:1250px}
  #s1 .q em{color:var(--ice);font-style:normal}
  #s1 .ans{margin-top:5vh;font-size:clamp(22px,2.5vw,37px);line-height:1.5;color:var(--ice);max-width:1120px}
  #s1 .ans b{color:#fff}
  #s1 .byline{position:absolute;bottom:4vh;font-size:16px;color:#7E9AC0}

  /* ===== S2 ===== */
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8vw;margin-top:5vh;flex:1;align-content:start}
  .ucard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:3.4vh 1.8vw;box-shadow:0 4px 18px rgba(18,63,112,.08)}
  .num{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:25px;display:flex;align-items:center;justify-content:center}
  .ucard h3{font-size:clamp(21px,2.2vw,31px);color:var(--navy);margin:2.2vh 0 1vh;line-height:1.25}
  .ucard .one{font-size:clamp(16px,1.7vw,23px);color:var(--muted);line-height:1.45}
  .bigfact{margin-top:auto;padding:2vh 2vw;background:var(--tint);border-radius:14px;display:flex;align-items:baseline;gap:1.2vw}
  .bigfact .pct{font-family:var(--serif);font-size:clamp(42px,4.4vw,62px);font-weight:800;color:var(--navy)}
  .bigfact .txt{font-size:clamp(17px,1.8vw,24px);line-height:1.4}

  /* ===== Demo ===== */
  #sdemo h2{font-size:clamp(26px,2.9vw,40px)}
  .demoframe{flex:1;min-height:0;display:flex;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 30px rgba(11,44,82,.18);margin-top:2vh;background:#fff}
  .d-side{width:440px;flex-shrink:0;background:var(--deep);color:#fff;padding:20px 20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
  .sec-label{font-size:19px;letter-spacing:1.3px;text-transform:uppercase;color:#8FB0D8;font-weight:700}
  .asset{background:var(--panel);border-radius:9px;padding:10px 11px;margin-top:6px}
  .asset .name{font-size:25px;font-weight:700}
  .asset .subt{font-size:20px;color:var(--ice);margin-top:3px}
  .kv{display:flex;justify-content:space-between;font-size:20px;margin-top:11px}
  .kv .k{color:#8FB0D8}.kv .v{font-family:var(--mono);color:#fff}
  .trow{display:flex;align-items:center;gap:7px;background:var(--panel);border-radius:7px;padding:6px 9px;margin-top:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .dot.warn{background:var(--warn)}
  .trow .tn{font-size:20px;color:#C2D6EE;flex:1}
  .trow .tv{font-family:var(--mono);font-size:20px;color:#fff}
  .d-hint{font-size:18px;color:#7E9AC0;line-height:1.5;margin-top:auto;padding-top:6px}
  .d-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
  .d-top{flex-shrink:0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px}
  .d-logo{width:28px;height:28px;border-radius:6px;background:var(--green);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .d-top h4{font-size:18px;font-weight:600}
  .d-tag{font-size:12px;background:var(--panel);color:var(--ice);padding:3px 8px;border-radius:99px;letter-spacing:.5px;text-transform:uppercase}
  .d-top .du{margin-left:auto;font-size:14px;color:var(--ice)}
  .chat{flex:1;overflow-y:auto;padding:16px 20px 8px;display:flex;flex-direction:column;gap:11px}
  .msg{max-width:86%;border-radius:11px;padding:15px 20px;font-size:25px;line-height:1.55;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px}
  .msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px;box-shadow:0 2px 8px rgba(18,63,112,.05)}
  .msg.bot .head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .msg.bot .avatar{width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .msg.bot .who{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:.4px}
  .msg.bot b{color:var(--navy)}
  .causes{margin:8px 0 3px;display:flex;flex-direction:column;gap:5px}
  .cause{display:flex;gap:8px;align-items:flex-start;background:#EFF4FA;border-radius:8px;padding:7px 10px}
  .prob{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);flex-shrink:0;width:50px}
  .cause .ct{font-size:23px;line-height:1.45}
  .cause .ct b{display:block}
  .steps{margin:7px 0 3px;counter-reset:st;display:flex;flex-direction:column;gap:4px;list-style:none}
  .steps li{counter-increment:st;display:flex;gap:8px;font-size:23px;line-height:1.45}
  .steps li::before{content:counter(st);flex-shrink:0;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .part{display:flex;gap:8px;align-items:center;background:#EFF7F1;border:1px solid #CDE7D4;border-radius:8px;padding:13px 15px;margin-top:7px;font-size:23px}
  .part .pid{font-family:var(--mono);font-weight:700;color:#1A7A38}
  .sources{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
  .src{display:inline-flex;align-items:center;gap:4px;font-size:15.5px;font-family:var(--mono);background:#EAF1FA;color:var(--accent);border:1px solid #CFE0F2;border-radius:99px;padding:5px 11px}
  .src::before{content:"⛁";font-size:8px}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:11px;border-bottom-left-radius:3px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#8FA9C8;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,70%,100%{opacity:.25}35%{opacity:1}}
  .d-input{flex-shrink:0;padding:8px 20px 12px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--accent);color:var(--accent);background:#fff;font-size:21px;font-weight:600;border-radius:99px;padding:11px 19px;cursor:pointer;transition:.15s;font-family:var(--sans)}
  .chip:hover{background:var(--accent);color:#fff}
  .chip:disabled{opacity:.35;cursor:default;pointer-events:none}

  /* ===== S3 Flywheel ===== */
  #s3 .wrap{flex:1;display:flex;gap:4vw;align-items:center;min-height:0}
  .fly{flex-shrink:0;width:min(44vw,56vh);height:min(44vw,56vh);position:relative}
  .fly svg{width:100%;height:100%}
  .ring{fill:none;stroke:#CFE2D6;stroke-width:3}
  .ringflow{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-dasharray:26 18;opacity:0;transition:opacity .5s}
  .fly.spin .ringflow{opacity:1;animation:spin 9s linear infinite}
  @keyframes spin{to{stroke-dashoffset:-440}}
  .fnode{opacity:.18;transition:opacity .45s}
  .fnode.on{opacity:1}
  .fnode circle{fill:#fff;stroke:var(--accent);stroke-width:2.5}
  .fnode.core circle{fill:var(--navy);stroke:var(--navy)}
  .fnode text{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--navy);text-anchor:middle}
  .fnode.core text{fill:#fff;font-size:16px}
  .fly .corelabel{font-family:var(--serif)}
  #s3 .legend{flex:1;display:flex;flex-direction:column;gap:2.6vh}
  .lrow{display:flex;gap:1.2vw;align-items:flex-start}
  .lnum{flex-shrink:0;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
  .lrow h3{font-size:clamp(20px,2.2vw,30px);color:var(--navy);line-height:1.2}
  .lrow p{font-size:clamp(15px,1.6vw,21px);color:var(--muted);margin-top:.4vh;max-width:34vw}
  .lock{margin-top:1vh;padding:1.8vh 1.6vw;background:var(--navy);border-radius:13px;color:#fff;font-size:clamp(16px,1.7vw,23px);line-height:1.45}
  .lock b{color:var(--ice)}

  /* ===== Fleet ===== */
  #sfleet{justify-content:flex-start}
  .zb{display:inline-block;margin-left:10px;background:var(--ice);color:var(--navy);font-size:12px;font-weight:800;letter-spacing:1.5px;padding:4px 11px;border-radius:99px;vertical-align:middle}
  .flwrap{flex:1;display:flex;gap:2vw;align-items:center;min-height:0;margin-top:2vh}
  .flscene{flex:1;height:100%;min-width:0}
  .flscene svg{width:100%;height:100%}
  .flside{width:clamp(240px,24vw,360px);flex-shrink:0;display:flex;flex-direction:column;gap:1.6vh}
  .flcap{background:var(--panel);border-radius:14px;padding:2.2vh 1.4vw;height:20vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .flcap .step{font-size:17px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--ice);transition:.3s}
  .flcap .txt{font-size:clamp(18px,1.8vw,25px);line-height:1.4;margin-top:1vh;font-weight:600;color:#fff;transition:.3s}
  .flstat{display:flex;flex-direction:column;align-items:flex-start;gap:.6vh;background:var(--deep);border-radius:14px;padding:2vh 1.4vw;opacity:.25;transition:.5s}
  .flstat.on{opacity:1}
  .flstat .big{font-family:var(--serif);font-size:clamp(34px,3.6vw,54px);font-weight:800;color:var(--ice);white-space:nowrap}
  .flstat .lbl{font-size:clamp(14px,1.4vw,19px);line-height:1.35;color:#C2D6EE}
  .flmoat{background:#fff;color:var(--navy);border-radius:14px;padding:2vh 1.4vw;font-size:clamp(15px,1.55vw,21px);line-height:1.4;opacity:.2;transform:translateY(8px);transition:.5s}
  .flmoat.on{opacity:1;transform:none}
  .flmoat b{color:var(--accent)}
  .flfed{font-size:clamp(13px,1.3vw,17px);color:#8FB0D8;line-height:1.5}
  .flfed b{color:var(--ice)}
  .conn{stroke:#2A4A74;stroke-width:1.4;fill:none;opacity:.3;transition:opacity .5s}
  .conn.flow{stroke:#BFD6EE;stroke-width:2.6;opacity:.95;stroke-dasharray:7 11;animation:flowin 1.1s linear infinite}
  .conn.out{stroke:#8FE3AC;stroke-width:2.6;opacity:.95;stroke-dasharray:7 11;animation:flowout 1.1s linear infinite}
  @keyframes flowin{to{stroke-dashoffset:-36}}
  @keyframes flowout{to{stroke-dashoffset:36}}
  .flnode circle{fill:#1B4E86;stroke:#BFD6EE;stroke-width:2;transition:fill .55s ease, stroke .55s ease, stroke-width .3s ease}
  .flnode.sig circle{fill:#D97706;stroke:#FFD9A0;animation:sigpulse 1.4s ease-in-out infinite}
  .flnode.ok circle{fill:#2BA84A;stroke:#A8E0B6}
  @keyframes sigpulse{0%,100%{stroke-width:2.5}50%{stroke-width:6}}
  .flcore #fleos{transition:fill .5s ease, stroke-width .4s ease}
  .flcore.recv #fleos{stroke-width:4}
  .flcore.proc #fleos{fill:#6CB23E;stroke-width:6}
  .flhalo{transition:opacity .4s}
  .flhalo.on{animation:halopulse 1.7s ease-in-out infinite}
  @keyframes halopulse{0%,100%{opacity:.12}50%{opacity:.55}}
  .region{font-family:var(--sans);font-size:16px;font-weight:800;letter-spacing:2px;fill:#FFFFFF;text-transform:uppercase}
  .flcore text{font-family:var(--serif);fill:#fff;text-anchor:middle;font-weight:800}
  .wave{fill:none;stroke:var(--ice);stroke-width:3;opacity:0}

  /* ===== S4 ===== */
  .stufen{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8vw;margin-top:4.5vh}
  .scard{border-radius:16px;padding:3vh 1.7vw;background:var(--tint)}
  .scard.hl{background:var(--navy);color:#fff}
  .scard .slabel{font-size:clamp(12px,1.1vw,15px);letter-spacing:2.5px;font-weight:800;text-transform:uppercase;color:var(--accent)}
  .scard.hl .slabel{color:var(--ice)}
  .scard h3{font-size:clamp(19px,2vw,27px);color:var(--navy);margin-top:1.2vh;line-height:1.25}
  .scard.hl h3{color:#fff}
  .scard .one{font-size:clamp(15px,1.5vw,20px);color:var(--muted);margin-top:1vh;line-height:1.45}
  .scard.hl .one{color:var(--ice)}
  .pilot{margin-top:auto;background:var(--navy);border-radius:16px;padding:2.6vh 2vw;color:#fff;display:flex;align-items:center;gap:2vw}
  .pilot .big{font-family:var(--serif);font-size:clamp(30px,3.4vw,48px);font-weight:800;color:var(--ice);white-space:nowrap}
  .pilot .pt{font-size:clamp(16px,1.7vw,23px);line-height:1.5}
  .pilot .pt b{color:var(--ice)}

  /* ===== S5 ===== */
  #s5{justify-content:center}
  #s5 .qecho{font-size:clamp(18px,1.9vw,25px);color:#7E9AC0;margin-top:1.5vh;font-style:italic}
  .assets{display:grid;grid-template-columns:1fr 1fr;gap:1.5vw;margin-top:3.4vh;max-width:1200px}
  .acard{background:var(--panel);border-radius:16px;padding:2.7vh 1.9vw;display:flex;flex-direction:column;gap:.7vh;box-shadow:0 6px 22px rgba(11,30,55,.28);border-left:5px solid var(--ice)}
  .acard .anum{width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
  .acard .at{font-size:clamp(18px,1.8vw,25px);font-weight:700;color:#fff;line-height:1.2;margin-top:.9vh}
  .acard .as{font-size:clamp(13px,1.3vw,17px);color:#C2D6EE;line-height:1.45}
  #s5 .close{margin-top:3.4vh;font-family:var(--serif);font-size:clamp(23px,2.6vw,36px);color:var(--ice);line-height:1.45;max-width:1200px}
  #s5 .close b{color:#fff}

  /* Nav */
  .arrow{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(18,63,112,.15);color:var(--navy);font-size:18px;cursor:pointer;z-index:40;transition:.15s}
  .dark-mode .arrow{background:rgba(255,255,255,.12);color:#fff}
  .arrow:hover{background:var(--accent);color:#fff}
  .arrow.prev{left:12px}.arrow.next{right:12px}
  .counter{position:fixed;bottom:14px;right:18px;font-family:var(--mono);font-size:14px;color:#8FB0D8;z-index:50}

  @media (max-width:880px){.cards3,.stufen,.assets{grid-template-columns:1fr}.d-side{display:none}#s3 .wrap,.flwrap{flex-direction:column}.lrow p{max-width:none}}

  /* ===== Mobile / small screens ===== */
  @media (max-width:760px){
    .brandmark{display:none}
    .storybar{justify-content:flex-start;gap:0;overflow-x:auto;overflow-y:hidden;padding:0 92px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .storybar::-webkit-scrollbar{display:none}
    .snode .lbl{font-size:11px;letter-spacing:.3px;padding:5px 8px}
    .snode .ln{width:9px}
    .langsw{right:8px;top:8px;height:28px;padding:0 3px;gap:2px}
    .langsw button{font-size:12px;height:20px;line-height:20px;padding:0 8px}

    section{padding:2.6vh 6vw 9vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    h2{font-size:26px;margin-top:.6vh}
    .eyebrow{font-size:12px;letter-spacing:2px}

    #s1{justify-content:flex-start;padding-top:5vh}
    #s1 .q{font-size:29px;line-height:1.22}
    #s1 .ans{font-size:18px;margin-top:3vh}
    #s1 .byline{position:static;margin-top:3vh;font-size:13px}

    .cards3{margin-top:3vh;gap:14px}
    .ucard{padding:18px 16px;border-radius:14px}
    .ucard h3{font-size:20px;margin:12px 0 6px}
    .ucard .one{font-size:15px}
    .num{width:42px;height:42px;font-size:20px}
    .bigfact{flex-direction:column;gap:6px;padding:16px}
    .bigfact .pct{font-size:38px}
    .bigfact .txt{font-size:16px}

    #sdemo{padding-bottom:2.4vh}
    .demoframe{margin-top:1.4vh;border-radius:12px}
    .msg{font-size:15px;padding:11px 14px;max-width:93%}
    .msg.bot .who{font-size:12px}
    .msg.bot .avatar{width:18px;height:18px;font-size:9px}
    .cause .ct{font-size:14px}.cause .prob{font-size:12px;width:38px}
    .steps li{font-size:14px}.part{font-size:14px}.src{font-size:12px}
    .d-top h4{font-size:15px}.d-tag{font-size:10px}.d-top .du{display:none}
    .chip{font-size:14px;padding:8px 13px}
    .chat{padding:12px 14px 6px;gap:8px}

/* ============ State ============ */
const SECTIONS=["s1","s2","sdemo","s3","sfleet","s4","s5"];
let cur=0, authed=false, LANG='de';

/* ============ Login ============ */
const CREDS={user:'meri', pass:'meri2026'};
function doLogin(e){
  e.preventDefault();
  const u=document.getElementById('gu').value.trim();
  const p=document.getElementById('gp').value;
  if(u===CREDS.user && p===CREDS.pass){
    authed=true;
    document.getElementById('gate').classList.add('hidden');
  }else{
    document.getElementById('gerr').textContent=I18N[LANG]['gate.err'];
    document.getElementById('gp').value='';
  }
  return false;
}

/* ============ i18n apply ============ */
function setLang(lang){
  if(!I18N[lang])return;
  LANG=lang;
  const dict=I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    const v=dict[k];
    if(v===undefined)return;
    if(el.namespaceURI==='http://www.w3.org/2000/svg' || v.indexOf('<')===-1){
      el.textContent=v;
    }else{
      el.innerHTML=v;
    }
  });
  document.documentElement.lang = lang==='zh'?'zh-CN':lang;
  document.querySelectorAll('#langsw button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  // gate error refresh
  const ge=document.getElementById('gerr'); if(ge.textContent) ge.textContent=dict['gate.err'];
  // demo: reset chat to greeting in current language
  resetDemo();
  // fleet: re-render current phase text
  Fleet.refresh();
}

  const n=document.createElement('div');n.className='snode'+(i===0?' cur':'');
  n.innerHTML=`<span class="lbl" data-i18n="nav.${i}"></span><span class="ln"></span>`;
  n.querySelector('.lbl').onclick=()=>jump(i);
  sb.appendChild(n);
}
function paintBar(){
  document.querySelectorAll('.snode').forEach((n,i)=>{
    n.classList.toggle('cur',i===cur);
    n.classList.toggle('done',i<cur);
  });
}

function frags(i){return [...document.getElementById(SECTIONS[i]).querySelectorAll('.frag')];}

function flySync(fragEl,on){
  if(!fragEl)return;
  const id=fragEl.dataset.fly;
  if(id)document.getElementById(id).classList.toggle('on',on);
  if(fragEl.dataset.spin)document.getElementById('fly').classList.toggle('spin',on);
  if(id&&on)document.getElementById('f0').classList.add('on');
}

function jump(i){
  if(i===cur)return;
  document.getElementById(SECTIONS[cur]).classList.remove('active');
  cur=i;
  const sec=document.getElementById(SECTIONS[cur]);
  sec.classList.add('active');
  frags(cur).forEach(f=>{f.classList.remove('on');flySync(f,false);});
  if(SECTIONS[cur]==='sfleet')Fleet.reset();
  document.getElementById('counter').textContent=(cur+1)+' / '+SECTIONS.length;
  document.body.classList.toggle('dark-mode',sec.classList.contains('dark'));
  paintBar();
}

function step(d){
  if(SECTIONS[cur]==='sfleet'){
    if(d>0){ if(Fleet.next())return; if(cur<SECTIONS.length-1)jump(cur+1); return; }
    if(Fleet.prev())return; if(cur>0)jump(cur-1); return;
  }
  const fr=frags(cur);
  if(d>0){
    const next=fr.find(f=>!f.classList.contains('on'));
    if(next){next.classList.add('on');flySync(next,true);return;}
    if(cur<SECTIONS.length-1)jump(cur+1);
  }else{
    const shown=[...fr].reverse().find(f=>f.classList.contains('on'));
    if(shown){shown.classList.remove('on');flySync(shown,false);return;}
    if(cur>0){
      jump(cur-1);
      if(SECTIONS[cur]==='sfleet')Fleet.last();
      else frags(cur).forEach(f=>{f.classList.add('on');flySync(f,true);});
    }
  }
}

document.addEventListener('keydown',e=>{
  if(!authed)return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();step(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1);}
  if(e.key==='Home')jump(0);
});

/* ===== Touch / swipe navigation (mobile) ===== */
(function(){
  let sx=0, sy=0, st=0, tracking=false;
  document.addEventListener('touchstart',function(e){
    if(!authed||e.touches.length!==1)return;
    const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); tracking=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!authed||!tracking)return; tracking=false;
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(dt<700 && Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.7){ step(dx<0?1:-1); }
  },{passive:true});
})();

/* ============ Fleet Intelligence ============ */
const Fleet=(function(){
  const NS='http://www.w3.org/2000/svg';
  const FL_NODES=[
    {x:215,y:150},{x:150,y:240},{x:275,y:235},{x:185,y:330},{x:300,y:350},{x:130,y:355},
    {x:455,y:110},{x:545,y:120},{x:610,y:165},{x:435,y:175},{x:530,y:185},
    {x:765,y:175},{x:845,y:215},{x:795,y:305},{x:860,y:345},{x:735,y:360},{x:835,y:145}
  ];
  const SENDERS=[0,3,7,9,12,14];
  const CX=500,CY=300;
  const cns=document.getElementById('flconns'),nds=document.getElementById('flnodes');
  FL_NODES.forEach((n,i)=>{
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',n.x);ln.setAttribute('y1',n.y);ln.setAttribute('x2',CX);ln.setAttribute('y2',CY);
    ln.setAttribute('class','conn');ln.id='flc'+i;cns.appendChild(ln);
    const g=document.createElementNS(NS,'g');g.setAttribute('class','flnode');g.id='fln'+i;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',11);
    c.style.transitionDelay=(Math.hypot(n.x-CX,n.y-CY)/650).toFixed(2)+'s';
    g.appendChild(c);nds.appendChild(g);
  });
  const capStep=document.getElementById('flcapStep'),capTxt=document.getElementById('flcapTxt');
  const wave=document.getElementById('flwave'),halo=document.getElementById('flhalo'),core=document.getElementById('flcore');
  const flstat=document.getElementById('flstat'),flmoat=document.getElementById('flmoat');
  const MAX=6;let phase=0;
  function node(i){return document.getElementById('fln'+i);}
  function conn(i){return document.getElementById('flc'+i);}
  function clearAll(){
    FL_NODES.forEach((n,i)=>node(i).classList.remove('sig','ok'));
    for(let i=0;i<FL_NODES.length;i++)conn(i).setAttribute('class','conn');
    core.classList.remove('recv','proc');halo.classList.remove('on');
    wave.style.opacity=0;flstat.classList.remove('on');flmoat.classList.remove('on');
  }
  function render(p){
    clearAll();
    const caps=FLEET_CAPS[LANG];
    capStep.textContent=caps[p][0];capTxt.textContent=caps[p][1];
    if(p>=1&&p<=3)SENDERS.forEach(i=>node(i).classList.add('sig'));
    if(p===2||p===3)SENDERS.forEach(i=>conn(i).setAttribute('class','conn flow'));
    if(p===2)core.classList.add('recv');
    if(p===3){core.classList.add('proc');halo.classList.add('on');}
    if(p>=4){
      core.classList.add('proc');
      FL_NODES.forEach((n,i)=>node(i).classList.add('ok'));
      for(let i=0;i<FL_NODES.length;i++)conn(i).setAttribute('class','conn out');
    }
    if(p===4){wave.style.opacity='.7';wave.animate([{r:80,opacity:.7},{r:560,opacity:0}],{duration:1900,easing:'ease-out',fill:'forwards'});}
    if(p>=5)flstat.classList.add('on');
    if(p>=6)flmoat.classList.add('on');
  }
  return {
    reset(){phase=0;render(0);},
    last(){phase=MAX;render(MAX);},
    next(){if(phase<MAX){phase++;render(phase);return true;}return false;},
    prev(){if(phase>0){phase--;render(phase);return true;}return false;},
    refresh(){render(phase);}
  };
})();

/* ============ Init ============ */
setLang('de');
Fleet.reset();
